# Template: project-root sqlc.yaml.
# Schema comes from goose migrations so schema and queries stay verifiably in
# sync. Generated code lands in internal/infra/postgres/gen (package gen) and
# must never be edited by hand or imported outside internal/infra/postgres.
version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "gen"
        out: "internal/infra/postgres/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
