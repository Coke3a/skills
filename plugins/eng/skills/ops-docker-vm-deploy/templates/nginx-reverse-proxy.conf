# /etc/nginx/sites-available/<APP>  →  symlink into sites-enabled/
# Installed by hand. `nginx -t` then `systemctl reload nginx` — never restart, which
# would drop connections for every other site on the machine.
#
# Two stages, because nginx will not start with an ssl_certificate path that does not
# exist yet. Serve :80, obtain the certificate, then swap to the block at the bottom.
#
# Replace: <DOMAIN>, <PORT>, <APP>, <BODY-LIMIT>.

# ---- stage 1: :80 only -----------------------------------------------------------
server {
    listen 80;
    server_name <DOMAIN>;

    # ACME HTTP-01. Create the directory before requesting a certificate.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Must be >= the app's own request body limit, or large uploads fail at the proxy
    # with a different error than the app would give.
    client_max_body_size <BODY-LIMIT>;

    location / {
        proxy_pass http://127.0.0.1:<PORT>;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/<APP>.access.log;
    error_log  /var/log/nginx/<APP>.error.log;
}

