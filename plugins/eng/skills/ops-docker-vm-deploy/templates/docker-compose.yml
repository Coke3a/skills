# Lives at /opt/<APP>/docker-compose.yml. Shipped by CI on every deploy — edit in git.
# Needs two siblings on the host: app.env (secrets, by hand, chmod 600)
# and .env (TAG=, written by CI).
#
# Replace: <APP>, <REGISTRY>, <ORG-LOWERCASE>, <PORT>, <NETWORK>.

name: <APP>

services:
  app:
    # <ORG-LOWERCASE> must be lowercase — Docker rejects uppercase repository names,
    # and this must match what the metadata action produced.
    image: <REGISTRY>/<ORG-LOWERCASE>/<APP>:${TAG}
    container_name: <APP>
    restart: unless-stopped

    env_file:
      - ./app.env

    networks:
      - <NETWORK>

    # Loopback only. Docker's iptables rules bypass ufw, so "3000:3000" would put
    # this on the public internet regardless of the firewall.
    ports:
      - "127.0.0.1:<PORT>:<PORT>"

    # healthcheck is inherited from the image; do not redefine it here or the
    # timings will drift from the deploy script's poll budget.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Hard cap so an OOM kills this container rather than a neighbour's database.
    mem_limit: 1g

networks:
  <NETWORK>:
    external: true
