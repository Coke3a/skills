# Template: project-root sqlc.yaml.
# Schema comes from golang-migrate migrations so schema and queries stay
# verifiably in sync. Generated code lands in internal/infra/postgres/gen
# (package gen) and must never be edited by hand or imported outside
# internal/infra/postgres.
#
# ⚠ Standalone Go repo only. In a coke-eng:stack-go-react-postgres monorepo,
#   sqlc.yaml lives one level down in backend/ and migration/ sits at the
#   repository root instead — use that skill's templates/sqlc.yaml
#   (schema: "../migration") so there is only ever one migration directory.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migration"
    queries: "db/queries"
    gen:
      go:
        package: "gen"
        out: "internal/infra/postgres/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
