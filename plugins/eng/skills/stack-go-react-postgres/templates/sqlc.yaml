# <project>/backend/sqlc.yaml
#
# There is no ORM, so the generator reads the schema straight out of the migration
# directory. sqlc supports golang-migrate natively and ignores every .down.sql.
#
# ⚠ coke-eng:go-clean-architecture's own templates/sqlc.yaml is written for a
#   standalone Go repo — it reads schema: "migration" from beside itself. In this
#   monorepo sqlc.yaml lives in backend/, one level below migration/, so copying
#   that file unedited here reads the wrong path. schema: "../migration" below is
#   the fix; the tool (golang-migrate) already matches, only the depth differs.

version: "2"
sql:
  - engine: "postgresql"
    schema: "../migration"      # ← repository root. The only place a schema exists.
    queries: "db/queries"       # ← inside backend/. The boundary: the Go stack's business.
    gen:
      go:
        package: "gen"
        out: "db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
