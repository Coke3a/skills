# <project>/backend/sqlc.yaml
#
# There is no ORM, so the generator reads the schema straight out of the migration
# directory. sqlc supports golang-migrate natively and ignores every .down.sql.
#
# ⚠ coke-eng:go-clean-architecture ships a goose-flavoured sqlc.yaml pointing at
#   backend/db/migrations/. Using it here produces a SECOND migrations directory that
#   sqlc reads and nobody runs. These two paths are the fix.

version: "2"
sql:
  - engine: "postgresql"
    schema: "../migration"      # ← repository root. The only place a schema exists.
    queries: "db/queries"       # ← inside backend/. The boundary: the Go stack's business.
    gen:
      go:
        package: "gen"
        out: "db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
